<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fenton United — Payments</title>
<style>
  :root{
    --bg:#081410; --bg2:#050d09; --panel:#10231a; --panel2:#0c1d14;
    --green:#2ab852; --green-dk:#166834; --gold:#e9c450; --gold-dk:#b8912a;
    --white:#f4f7f3; --mute:#96ac9d; --faint:#5d7466; --red:#e05252; --hair:#1e3626;
    --cond:'Arial Narrow','AvenirNextCondensed-Bold','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--white); font-family:-apple-system,system-ui,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:16px; min-height:100vh; padding-bottom:84px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(8,20,16,.96); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--hair); padding:14px 16px 10px;
  }
  header .row{display:flex; align-items:baseline; justify-content:space-between;}
  header h1{
    font-family:var(--cond); font-weight:800; letter-spacing:.06em;
    font-size:22px; text-transform:uppercase;
  }
  header h1 span{color:var(--green);}
  #hdrOwed{font-family:var(--cond); font-size:15px; color:var(--gold); letter-spacing:.04em;}
  .banner{
    background:var(--panel); border:1px solid var(--gold-dk); color:var(--gold);
    border-radius:10px; padding:8px 12px; font-size:13px; margin-top:8px; display:none;
  }
  main{padding:14px 14px 20px; max-width:560px; margin:0 auto;}

  /* tab bar */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(6,13,10,.97); border-top:1px solid var(--hair);
    display:flex; padding:6px 4px calc(10px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1; background:none; border:none; color:var(--faint); font-family:var(--cond);
    font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:10px 0 4px; cursor:pointer;
  }
  nav button .ico{display:block; font-size:19px; margin-bottom:3px;}
  nav button.active{color:var(--green);}

  h2{
    font-family:var(--cond); text-transform:uppercase; letter-spacing:.08em;
    font-size:13px; color:var(--gold); margin:18px 2px 8px;
  }
  .card{
    background:var(--panel); border-radius:14px; padding:14px; margin-bottom:10px;
  }
  .card.flat{padding:0; overflow:hidden;}
  .rowline{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 14px; border-bottom:1px solid var(--hair); cursor:pointer;
  }
  .rowline:last-child{border-bottom:none;}
  .rowline .nm{font-weight:600; font-size:16px;}
  .rowline .sub{color:var(--faint); font-size:12.5px; margin-top:2px;}
  .pill{
    font-family:var(--cond); font-weight:800; letter-spacing:.03em;
    border-radius:999px; padding:5px 13px; font-size:15px; white-space:nowrap;
  }
  .owes{background:#3a1616; color:#ff9d9d;}
  .clear{background:#12301c; color:#7fd89b;}
  .credit{background:#132a33; color:#8fd4ea;}

  button.primary,button.ghost,button.danger,button.gold{
    display:block; width:100%; border:none; border-radius:12px; padding:14px;
    font-family:var(--cond); font-size:16px; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; margin-top:10px;
  }
  button.primary{background:var(--green); color:#06130a;}
  button.gold{background:var(--gold); color:#171204;}
  button.ghost{background:none; border:1.5px solid var(--hair); color:var(--mute);}
  button.danger{background:none; border:1.5px solid #5a2626; color:var(--red);}
  .btnrow{display:flex; gap:8px;} .btnrow button{flex:1;}

  label{display:block; font-size:12.5px; color:var(--mute); margin:12px 2px 5px; letter-spacing:.02em;}
  input,select,textarea{
    width:100%; background:var(--panel2); color:var(--white); border:1px solid var(--hair);
    border-radius:10px; padding:12px; font-size:16px; font-family:inherit;
  }
  textarea{min-height:150px; line-height:1.45; font-size:14px;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--green-dk);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

  /* minutes quick buttons */
  .minrow{display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--hair);}
  .minrow .who{flex:1; font-weight:600; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .minbtn{
    border:1.5px solid var(--hair); background:none; color:var(--mute); border-radius:8px;
    font-family:var(--cond); font-weight:800; font-size:13px; padding:8px 0; width:46px; cursor:pointer;
  }
  .minbtn.sel{background:var(--green); border-color:var(--green); color:#06130a;}
  .cardbtn{width:34px; font-size:12px;}
  .cardbtn.selY{background:var(--gold); border-color:var(--gold); color:#171204;}
  .cardbtn.selR{background:var(--red); border-color:var(--red); color:#fff;}

  /* ledger */
  .led{display:flex; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid var(--hair); font-size:14px;}
  .led:last-child{border-bottom:none;}
  .led .l{color:var(--white);} .led .l .sub{color:var(--faint); font-size:12px; margin-top:2px;}
  .led .amt{font-family:var(--cond); font-weight:800; font-size:15px; white-space:nowrap;}
  .chg{color:#ff9d9d;} .pay{color:#7fd89b;}
  .led .del{color:var(--faint); background:none; border:none; font-size:15px; padding:0 0 0 8px; cursor:pointer;}

  .stat{display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--hair); font-size:15px;}
  .stat:last-child{border-bottom:none;}
  .stat b{font-family:var(--cond); font-size:16px; letter-spacing:.03em;}
  .g{color:#7fd89b;} .r{color:#ff9d9d;} .go{color:var(--gold);}

  .back{
    background:none; border:none; color:var(--green); font-family:var(--cond);
    font-size:15px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:2px 0 10px; font-weight:800;
  }
  .note{color:var(--faint); font-size:12.5px; margin:8px 2px; line-height:1.5;}
  .empty{color:var(--faint); text-align:center; padding:28px 10px; font-size:14px; line-height:1.6;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); z-index:50;
    background:var(--green); color:#06130a; font-weight:700; border-radius:999px;
    padding:10px 20px; font-size:14px; display:none; white-space:nowrap;
  }
  .tag{font-family:var(--cond); font-size:11.5px; letter-spacing:.07em; color:var(--faint); text-transform:uppercase;}
  .matchhead{padding:13px 14px; border-bottom:1px solid var(--hair);}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>FENTON <span>PAYMENTS</span></h1>
    <div id="hdrOwed"></div>
  </div>
  <div class="banner" id="backupBanner">⚠ No backup for a while. More → Backup now.</div>
</header>

<main id="view"></main>

<nav>

  <button id="tb-more" onclick="go('more')"><span class="ico">☰</span>More</button>
</nav>
<div class="toast" id="toast"></div>

"mr8cazdpcc6ox", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99ca83vg", "playerId": "mr8cazdppz9ot", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99c6ln5m", "playerId": "mr8cazdpown25", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99cbq1um", "playerId": "mr8cazdpuhob4", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99ceqwe7", "playerId": "mr8cazdplrtnn", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99c4u7af", "playerId": "mr8cazdpsuzzr", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99coo08f", "playerId": "mr8cazdp0crib", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99cjcreo", "playerId": "mr8cazdp7el49", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99coa3c4", "playerId": "mr8cazdp0isit", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99c04lf2", "playerId": "mr8cazdpsz83i", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99c4813v", "playerId": "mr8cazdp4vozz", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99cm738c", "playerId": "mr8cazdposr7u", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99celhq7", "playerId": "mr8cazdp1df55", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99clmdtq", "playerId": "mr8cazdp7cy8x", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99dz10sx", "playerId": "mr8cazdp9g7k0", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99doy814", "playerId": "mr8cazdpg2ofo", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99daxod5", "playerId": "mr8cazdpq4q9s", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99dlcmbx", "playerId": "mr8cazdp9qd6j", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99d8gsrp", "playerId": "mr8cazdpr3ft2", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99d6bgr6", "playerId": "mr8cazdpi7qhi", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99d5ncdw", "playerId": "mr8cazdpvup5x", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99dkwa75", "playerId": "mr8cazdp5bswb", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99d18h3o", "playerId": "mr8cazdpnlk87", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99djgel6", "playerId": "mr8cazdp20k1z", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}, {"id": "mr8cb99dk3629", "playerId": "mr8cazdpo4s5h", "date": "2026-07-05", "type": "signon", "label": "Season 5 sign on fee", "amount": 3500}], "payments": [], "expenses": [{"id": "mr8cbfa5u70e0", "date": "2026-07-04", "label": "Referee \u00b7 Berry Brow Reserves (H)", "amount": 4500}]};
let db = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(SEED_JSON));
    const d = JSON.parse(raw);
    d.settings = Object.assign({}, DEF.settings, d.settings||{});
    for(const k of ['players','matches','apps','charges','payments','expenses']) d[k]=d[k]||[];
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(SEED_JSON)); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); refreshHdr(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ MONEY / DATE HELPERS ============ */
function fm(p){ // pence -> £ string
  const neg = p<0; p=Math.abs(p);
  const s = (p%100===0) ? '£'+(p/100) : '£'+(p/100).toFixed(2);
  return neg ? '-'+s : s;
}
function parseMoney(v){ const n=parseFloat(String(v).replace(/[£,\s]/g,'')); return isNaN(n)?null:Math.round(n*100); }
function fdate(iso){
  if(!iso) return '';
  const d=new Date(iso+'T12:00:00');
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }

/* ============ BALANCE ENGINE ============ */
function appCharge(a){
  const m = db.matches.find(x=>x.id===a.matchId); if(!m) return 0;
  if(a.mins<=0) return 0;
  if(m.pricing==='flat') return m.flatAmount;
  if(a.mins>60) return db.settings.tierOver60;
  if(a.mins>=45) return db.settings.tier45to60;
  return db.settings.tierUnder45;
}
function cardCharges(a){
  let t=0;
  if(a.cardY) t+=db.settings.cardY;
  if(a.cardR) t+=db.settings.cardR;
  return t;
}
function ledger(pid){ // full item list, chronological, each tagged with a category
  const items=[];
  for(const a of db.apps.filter(x=>x.playerId===pid)){
    const m=db.matches.find(x=>x.id===a.matchId); if(!m) continue;
    const c=appCharge(a);
    if(c>0) items.push({date:m.date, kind:'chg', cat:'subs', amt:c, label:m.opponent+' ('+(m.venue==='H'?'H':'A')+')', sub:fdate(m.date)+' · '+a.mins+' mins', ref:'app:'+a.id});
    if(a.cardY) items.push({date:m.date, kind:'chg', cat:'subs', amt:db.settings.cardY, label:'Yellow card — '+m.opponent, sub:fdate(m.date)+' · FA charge, no club profit', ref:'cardY:'+a.id});
    if(a.cardR) items.push({date:m.date, kind:'chg', cat:'subs', amt:db.settings.cardR, label:'Red card — '+m.opponent, sub:fdate(m.date)+' · FA charge, no club profit', ref:'cardR:'+a.id});
  }
  for(const c of db.charges.filter(x=>x.playerId===pid))
    items.push({date:c.date, kind:'chg', cat:(c.type==='signon'?'signon':'other'), amt:c.amount, label:c.label, sub:fdate(c.date), ref:'charge:'+c.id});
  for(const p of db.payments.filter(x=>x.playerId===pid))
    items.push({date:p.date, kind:'pay', cat:'payment', amt:p.amount, label:'Payment · '+(p.method==='cash'?'cash':'bank transfer'), sub:fdate(p.date)+(p.note?' · '+p.note:''), ref:'payment:'+p.id});
  items.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : 0);
  return items;
}
function balance(pid){
  let t=0;
  for(const i of ledger(pid)) t += (i.kind==='chg'? i.amt : -i.amt);
  return t;
}
function totalOwed(){
  let t=0;
  for(const p of db.players.filter(p=>p.active)){ const b=balance(p.id); if(b>0) t+=b; }
  return t;
}
function gamesBalance(pid){ // owed from games only — sign-on left out for now
  let t=0;
  for(const i of ledger(pid).filter(i=>i.cat!=='signon')) t += (i.kind==='chg'? i.amt : -i.amt);
  return t;
}

/* ============ NAV / RENDER ============ */
let route={page:'squad'};
function go(page, arg){ route={page, arg}; render(); window.scrollTo(0,0); }
function setTab(t){
  for(const id of ['squad','match','money','more']) document.getElementById('tb-'+id).classList.remove('active');
  const map={squad:'squad',matches:'match',match:'match',money:'money',more:'more',player:'squad',settings:'more'};
  const el=document.getElementById('tb-'+(map[t]||'squad')); if(el) el.classList.add('active');
}
function refreshHdr(){
  document.getElementById('hdrOwed').textContent = 'OWED: '+fm(totalOwed());
  const days=(Date.now()-(db.settings.lastBackup||0))/86400000;
  document.getElementById('backupBanner').style.display = (db.players.length&&days>7)?'block':'none';
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',1800);
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  setTab(route.page);
  const v=document.getElementById('view');
  v.innerHTML = PAGES[route.page] ? PAGES[route.page](route.arg) : '';
  refreshHdr();
}

/* ============ PAGES ============ */

/* ---- SQUAD ---- */

        <span class="amt ${i.kind==='chg'?'chg':'pay'}">${i.kind==='chg'?'+':'−'}${fm(i.amt)}</span>
        ${i.ref.startsWith('charge:')||i.ref.startsWith('payment:')?`<button class="del" onclick="delItem('${i.ref}','${pid}')">✕</button>`:''}
      </div>
    </div>`).join('');
}
PAGES.player = (pid)=>{

/* ---- MONEY ---- */
PAGES.money = ()=>{
  const pays=[...db.payments].sort((a,b)=> b.date<a.date?-1:1).slice(0,25);
  let collected=0, cash=0, bank=0;
  db.payments.forEach(p=>{ collected+=p.amount; if(p.method==='cash') cash+=p.amount; else bank+=p.amount; });
  let charged=0, signonCharged=0, subsCharged=0, otherCharged=0;
  db.players.forEach(p=>{ ledger(p.id).forEach(i=>{
    if(i.kind!=='chg') return;
    charged+=i.amt;
    if(i.cat==='signon') signonCharged+=i.amt;
    else if(i.cat==='subs') subsCharged+=i.amt;
    else otherCharged+=i.amt;
  }); });
  let spent=0; db.expenses.forEach(e=>spent+=e.amount);
  const rows=pays.length? pays.map(p=>{
    const pl=db.players.find(x=>x.id===p.playerId);
    return `<div class="led"><div class="l">${pl?esc(pl.name):'?'} · ${p.method==='cash'?'cash':'transfer'}<div class="sub">${fdate(p.date)}${p.note?' · '+esc(p.note):''}</div></div>
    <span class="amt pay">−${fm(p.amount)}</span></div>`;
  }).join('') : `<div class="empty">No payments recorded yet.</div>`;

    <div class="stat"><span>Other (tops, tracksuits, fines)</span><b>${fm(otherCharged)}</b></div>
    <div class="stat"><span>Total charged</span><b>${fm(charged)}</b></div>
  </div>
  <h2>Season money</h2>
  <div class="card">
    <div class="stat"><span>Collected</span><b class="g">${fm(collected)}</b></div>
    <div class="stat"><span>— by transfer</span><b class="g">${fm(bank)}</b></div>
    <div class="stat"><span>— in cash</span><b class="go">${fm(cash)}</b></div>
    <div class="stat"><span>Still owed</span><b class="r">${fm(totalOwed())}</b></div>
    <div class="stat"><span>Club costs logged</span><b class="r">${fm(spent)}</b></div>
    <div class="stat"><span>Collected minus costs</span><b class="${collected-spent>=0?'g':'r'}">${fm(collected-spent)}</b></div>

  <h2>Recent payments</h2>

/* ============ ACTIONS ============ */
function bulkAdd(){
  const t=document.getElementById('bulkNames').value.trim();
  if(!t) return toast('Type some names first');
  let n=0;
  for(let line of t.split('\n')){
    line=line.trim(); if(!line) continue;
    if(db.players.some(p=>p.name.toLowerCase()===line.toLowerCase())) continue;
    db.players.push({id:uid(), name:line, active:true}); n++;
  }
  save(); toast(n+' added'); render();
}
function archivePlayer(pid){
  const b=balance(pid);
  if(b>0 && !confirm('Still owes '+fm(b)+'. Archive anyway?')) return;
  const p=db.players.find(x=>x.id===pid); p.active=false; save(); go('squad'); toast('Archived');
}
function unarchive(pid){ db.players.find(x=>x.id===pid).active=true; save(); render(); toast('Restored'); }

function applySignOn(){
  let n=0;
  for(const p of db.players.filter(p=>p.active)){
    if(db.charges.some(c=>c.playerId===p.id && c.type==='signon')) continue;
    db.charges.push({id:uid(), playerId:p.id, date:today(), type:'signon', label:'Season 5 sign on fee', amount:db.settings.signOn}); n++;
  }
  save(); render(); toast(n? 'Sign on charged to '+n+' players' : 'Everyone already charged');
}

/* match form via prompt-free inline page */
function matchForm(){
  const v=document.getElementById('view');
  v.innerHTML=`
  <button class="back" onclick="go('matches')">‹ Cancel</button>
  <h2>New match</h2>
  <div class="card">
    <label>Opponent</label><input id="m_opp" placeholder="Berry Brow Reserves">
    <label>Date</label><input id="m_date" type="date" value="${today()}">
    <div class="grid2">
      <div><label>Venue</label><select id="m_venue" onchange="suggestPricing()"><option value="H">Home</option><option value="A">Away</option></select></div>
      <div><label>Type</label><select id="m_type" onchange="suggestPricing()"><option>Friendly</option><option>League</option><option>Cup</option></select></div>
    </div>
    <div class="grid2">
      <div><label>Pricing</label><select id="m_pricing"><option value="tiered">Tiered by minutes</option><option value="flat">Flat per player</option></select></div>
      <div><label>Flat amount £</label><input id="m_flat" value="${db.settings.awayFriendlyFlat/100}" inputmode="decimal"></div>
    </div>
    <label>Ref cost £ (logged as club cost, 0 for none)</label>
    <input id="m_ref" value="${db.settings.refCost/100}" inputmode="decimal">
    <button class="primary" onclick="createMatch()">Create match</button>
    <div class="note">Home games default to tiered pricing and a ref cost. Away friendlies default to flat ${fm(db.settings.awayFriendlyFlat)} each to split the ref.</div>
  </div>`;
  suggestPricing();
}
function suggestPricing(){
  const venue=document.getElementById('m_venue').value;
  const type=document.getElementById('m_type').value;
  const pr=document.getElementById('m_pricing');
  const ref=document.getElementById('m_ref');
  if(venue==='A' && type==='Friendly'){ pr.value='flat'; ref.value=0; }
  else if(venue==='A'){ pr.value='tiered'; ref.value=0; }
  else { pr.value='tiered'; ref.value=db.settings.refCost/100; }
}
function createMatch(){
  const opp=document.getElementById('m_opp').value.trim();
  if(!opp) return toast('Opponent name needed');
  const date=document.getElementById('m_date').value || today();
  const venue=document.getElementById('m_venue').value;
  const type=document.getElementById('m_type').value;
  const pricing=document.getElementById('m_pricing').value;
  const flat=parseMoney(document.getElementById('m_flat').value) ?? db.settings.awayFriendlyFlat;
  const refc=parseMoney(document.getElementById('m_ref').value) || 0;
  const id=uid();
  db.matches.push({id, opponent:opp, date, venue, type, pricing, flatAmount:flat});
  if(refc>0) db.expenses.push({id:uid(), date, label:'Referee · '+opp+' ('+venue+')', amount:refc});
  save(); go('match', id); toast('Match created. Set minutes.');
}
function delMatch(mid){
  if(!confirm('Delete this match and all its charges?')) return;
  db.matches=db.matches.filter(m=>m.id!==mid);
  db.apps=db.apps.filter(a=>a.matchId!==mid);
  save(); go('matches'); toast('Deleted');
}
function setMins(mid,pid,mins){
  let a=db.apps.find(x=>x.matchId===mid && x.playerId===pid);
  if(!a){ a={id:uid(), matchId:mid, playerId:pid, mins:0, cardY:false, cardR:false}; db.apps.push(a); }
  a.mins=mins;
  if(mins===0 && !a.cardY && !a.cardR) db.apps=db.apps.filter(x=>x.id!==a.id);
  save(); render();
}
function toggleCard(mid,pid,which){
  let a=db.apps.find(x=>x.matchId===mid && x.playerId===pid);
  if(!a){ a={id:uid(), matchId:mid, playerId:pid, mins:0, cardY:false, cardR:false}; db.apps.push(a); }
  if(which==='Y') a.cardY=!a.cardY; else a.cardR=!a.cardR;
  if(a.mins===0 && !a.cardY && !a.cardR) db.apps=db.apps.filter(x=>x.id!==a.id);
  save(); render();
}

function chargeForm(pid){
  const v=document.getElementById('view');
  const opts=db.players.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('');
  v.innerHTML=`
  <button class="back" onclick="go('player','${pid}')">‹ Cancel</button>
  <h2>Add charge</h2>
  <div class="card">
    <label>Player</label><select id="c_pid">${opts}</select>

function presetCharge(){
  const v=document.getElementById('c_preset').value; if(!v) return;
  const [label,amt]=v.split('|');
  document.getElementById('c_label').value=label;
  if(+amt>0) document.getElementById('c_amt').value=(+amt/100);
}
function addCharge(){
  const pid=document.getElementById('c_pid').value;
  const label=document.getElementById('c_label').value.trim();
  const amt=parseMoney(document.getElementById('c_amt').value);
  if(!label) return toast('Label needed');
  if(!amt || amt<=0) return toast('Enter an amount');
  db.charges.push({id:uid(), playerId:pid, date:document.getElementById('c_date').value||today(), type:'item', label, amount:amt});
  save(); go('player',pid); toast('Charge added');
}
function delItem(ref,pid){
  const [kind,id]=ref.split(':');
  if(kind==='charge'){ if(!confirm('Delete this charge?'))return; db.charges=db.charges.filter(c=>c.id!==id); }
  if(kind==='payment'){ if(!confirm('Delete this payment?'))return; db.payments=db.payments.filter(p=>p.id!==id); }
  save(); go('player',pid);
}
function expenseForm(){
  const v=document.getElementById('view');
  v.innerHTML=`
  <button class="back" onclick="go('money')">‹ Cancel</button>
  <h2>Club cost</h2>
  <div class="card">
    <label>What</label><input id="e_label" placeholder="Pitch hire instalment / balls / ref">
    <div class="grid2">
      <div><label>Amount £</label><input id="e_amt" inputmode="decimal"></div>
      <div><label>Date</label><input id="e_date" type="date" value="${today()}"></div>
    </div>
    <button class="primary" onclick="addExpense()">Save cost</button>
  </div>`;
}
function addExpense(){
  const label=document.getElementById('e_label').value.trim();
  const amt=parseMoney(document.getElementById('e_amt').value);
  if(!label||!amt) return toast('Fill both in');
  db.expenses.push({id:uid(), date:document.getElementById('e_date').value||today(), label, amount:amt});
  save(); go('money'); toast('Cost logged');
}

/* ============ MESSAGES ============ */
function playerMessage(pid){
  const p=db.players.find(x=>x.id===pid);
  const items=ledger(pid).filter(i=> i.cat!=='signon'); // sign-on left out of chase messages for now
  let lines=['*FENTON UNITED — subs update*', p.name+':',''];
  let chg=0,paid=0;
  for(const i of items){
    if(i.kind==='chg'){ chg+=i.amt; lines.push('• '+i.sub.split(' · ')[0]+' — '+i.label+(i.sub.includes('mins')?' — '+i.sub.split(' · ')[1]:'')+' — '+fm(i.amt)); }
    else paid+=i.amt;
  }
  const b = gamesBalance(pid);
  lines.push('');
  if(paid>0) lines.push('Paid so far: '+fm(paid));
  lines.push(b>0? '*Owed: '+fm(b)+'*' : b<0? '*In credit: '+fm(-b)+'*' : '*All square 👍*');
  if(b>0 && db.settings.bank) lines.push('', db.settings.bank, 'Reference: '+p.name.split(' ')[0].toUpperCase());
  return lines.join('\n');
}
function waMessage(pid){
  copyText(playerMessage(pid));
  toast('Message copied — paste into WhatsApp');
}
function gcMessage(){
  const owers=db.players.filter(p=>p.active).map(p=>({p,b:gamesBalance(p.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  if(!owers.length) return toast('Nobody owes anything 🎉');
  let lines=['*FENTON UNITED — subs owed* 💰',''];
  for(const {p,b} of owers) lines.push(p.name+' — '+fm(b));
  lines.push('','Message me for your breakdown.');
  if(db.settings.bank) lines.push(db.settings.bank);
  copyText(lines.join('\n'));
  toast('GC list copied');
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

/* ============ SETTINGS / BACKUP ============ */
function saveSettings(){
  const s=db.settings;
  const g=(id)=>parseMoney(document.getElementById(id).value);
  s.tierOver60=g('s_t1')??s.tierOver60; s.tier45to60=g('s_t2')??s.tier45to60; s.tierUnder45=g('s_t3')??s.tierUnder45;
  s.awayFriendlyFlat=g('s_af')??s.awayFriendlyFlat; s.signOn=g('s_so')??s.signOn; s.refCost=g('s_ref')??s.refCost;
  s.cardY=g('s_y')??s.cardY; s.cardR=g('s_r')??s.cardR;
  s.bank=document.getElementById('s_bank').value.trim();
  save(); toast('Settings saved'); render();
}
function exportJson(){
  db.settings.lastBackup=Date.now(); save();
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fenton-payments-backup-'+today()+'.json';
  a.click();
  toast('Backup saved');
  render();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.players || !d.settings) throw 0;
      if(!confirm('Replace everything with this backup?')) return;
      db=d; save(); render(); toast('Backup restored');
    }catch(e){ toast('Not a valid backup file'); }
  };
  r.readAsText(f);
}

/* ============ BOOT ============ */
render();
</script>
</body>
</html>
